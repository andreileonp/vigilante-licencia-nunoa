name: Vigilante Primera Licencia Ñuñoa

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (mínimo de GitHub; puede retrasarse algunos minutos)
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
    inputs:
      prueba:
        description: "Enviar un aviso de PRUEBA (no revisa el sitio)"
        type: boolean
        default: false

permissions:
  contents: write            # para guardar la última fecha avisada

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar disponibilidad
        id: revisar
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ inputs.prueba && 'true' || 'false' }}
        run: python vigilante.py

      - name: Guardar última fecha avisada
        run: |
          git config user.name "vigilante-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ultimo_aviso.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza última fecha avisada"
            git pull --rebase -q && git push -q
          fi

      - name: Avisar (marca la ejecución en rojo para que GitHub envíe el correo)
        if: steps.revisar.outcome == 'failure'
        run: |
          echo "Hay una nueva hora disponible. Revisa el resumen de esta ejecución."
          exit 1

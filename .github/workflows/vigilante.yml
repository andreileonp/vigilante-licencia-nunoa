name: Vigilante Primera Licencia Ñuñoa

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minutos (minimo de GitHub; puede retrasarse algunos minutos)
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
    inputs:
      prueba:
        description: "Prueba completa: lee la agenda real y envía un aviso de ejemplo"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar disponibilidad
        id: revisar
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ inputs.prueba && 'true' || 'false' }}
        run: python vigilante.py

      - name: Captura de error (diagnóstico)
        if: hashFiles('error.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: captura-error
          path: error.png
          retention-days: 3

      - name: Avisar (marca la ejecución en rojo para que GitHub envíe el correo)
        if: steps.revisar.outcome == 'failure'
        run: |
          echo "Hay una nueva hora disponible. Revisa el resumen de esta ejecución."
          exit 1
